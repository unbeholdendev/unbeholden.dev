name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '*.md'
      - .devcontainer/**
  workflow_dispatch:

env:
  IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy:
    runs-on: docker
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          # The host daemon keeps its layer cache between runs. The default driver holds
          # its own cache in a builder that is deleted when the job ends.
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}

      - name: Pin image to commit and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ vars.DOKPLOY_APP_ID }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE:$TAG\"}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
