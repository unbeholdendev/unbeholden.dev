name: deploy

on: workflow_dispatch

env:
  IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          # The host daemon keeps its layer cache between runs. The default driver holds
          # its own cache in a builder that is deleted when the job ends.
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}

      - name: Pin image to commit and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ vars.DOKPLOY_APP_ID }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE:$TAG\"}"
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"

      - name: Tell IndexNow what is live
        env:
          KEY: cb53de48ad0c6cf78d3f313f4578f0a4
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:$TAG" cat dist/client/sitemap-0.xml > sitemap.built
          # Deploying returns before Dokploy has swapped the container, so submitting
          # straight away would announce the URLs the old build served.
          for _ in $(seq 9); do
            curl -fsS https://unbeholden.dev/sitemap-0.xml | cmp -s - sitemap.built && break
            sleep 10
          done
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.built | sed -e 's|</*loc>||g' -e 's|.*|"&"|' | paste -sd,)
          curl -fsS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"unbeholden.dev\",\"key\":\"$KEY\",\"keyLocation\":\"https://unbeholden.dev/$KEY.txt\",\"urlList\":[$URLS]}"
