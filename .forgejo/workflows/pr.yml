name: check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        # An exact version downloads directly; "latest" asks the GitHub API, which rate-limits the runner's shared IP.
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome ci
      - run: bun run check
      - run: bun run test
