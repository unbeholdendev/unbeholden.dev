<svg viewBox="0 0 1200 670" role="img" aria-labelledby="sl-title sl-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="sl-title">How the wallet sends a payment without ever holding the key</title>
<desc id="sl-desc">The browser tab is watch-only. It holds a descriptor or xpub and no private key. To send, it builds a PSBT and shows it as an animated QR code to an air-gapped signer such as a SeedSigner. The signer holds the private key, which never leaves it. It shows the addresses and amounts; you approve and it signs. You scan the signed transaction back into the tab with the camera, or load it from a file. The wallet then broadcasts it through your chosen Electrum server or Esplora API.</desc>
