<svg viewBox="0 0 1200 690" role="img" aria-labelledby="ai-title ai-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="ai-title">Where the coding agent runs, and the only way its work leaves</title>
<desc id="ai-desc">The laptop holds the keys and runs no agent. It reaches a Proxmox host in the cupboard by SSH into one LXC container, deb-agent, which runs one dev container per repository: unbeholden.dev, dotfiles and infra. Those dev containers are the only place an agent runs. They have no route and no keys to the laptop. Their one way out is a push over the agent token to Forgejo, in another LXC on the same host, where the agent can push branches and open pull requests but cannot merge to main. The laptop pulls main from Forgejo and rebuilds itself with dots. The dev containers also fetch packages and docs from the open internet.</desc>
