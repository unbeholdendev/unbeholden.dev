<svg viewBox="0 0 1200 1080" role="img" aria-labelledby="hl-title hl-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="hl-title">The homelab, and which repository describes each part</title>
<desc id="hl-desc">At home: an OpenWrt router running AdGuard Home for DNS, a TrueNAS box running Jellyfin and Immich, and two Proxmox hosts, Rune and Dion. Ansible in the infra repository sets up the hosts at home and Giran. The Proxmox hosts run five LXCs: Goddard runs the Bitcoin node, Gludin runs Dokploy, Oren runs the dev containers and gets its shell from dotfiles, Heine runs Forgejo Actions jobs, and Aden runs Docker with a dozen containers. Ansible in infra installs Docker on Aden, but what runs on it is not in Git. Dion also hosts the Talos cluster as two VMs, a control plane with 2 vCPUs and 4 GiB and a worker with 4 vCPUs and 8 GiB, which OpenTofu in infra creates. Flux in infra reconciles the cluster, which runs Homepage, Renovate and Forgejo. The laptops, a T14 and a T460s, are built by dotfiles. Outside the house, Giran, a rented VPS that serves this site and mail, reaches the cluster over the tailnet.</desc>
