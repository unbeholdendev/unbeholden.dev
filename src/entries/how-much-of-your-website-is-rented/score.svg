<svg viewBox="0 0 1200 450" role="img" aria-labelledby="sc-title sc-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="sc-title">How this site scores 50: half its weight is owned</title>
<desc id="sc-desc">Check scored four services on unbeholden.dev, drawn as one bar whose segments are as wide as their weights, 9 in total. Owned: the web server, hosting, weight 3, and the mail server, mail, weight 1.5. Rented: SMTP2Go, mail, weight 1.5, and Spaceship DNS, DNS, weight 3. Mail, DNS and hosting each count 3, and the two mail providers share the mail weight, 1.5 each. Owned weight is 4.5 of 9, so the score is 50. Six findings are listed but not scored: Astro, the RSS feed, Open Graph tags, HSTS, HTTP/3 and a Google site verification record.</desc>
