<svg viewBox="0 0 1200 1000" role="img" aria-labelledby="ln-title ln-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="ln-title">One payment to hello@unbeholden.dev, and the one way in to home</title>
<desc id="ln-desc">A payer's wallet looks up hello@unbeholden.dev and sends GET /.well-known/lnurlp/hello to Giran, the VPS that serves this site. Giran passes the request over the tailnet, managed by Headscale, to lnurl-server at home, with the host that was asked for, unbeholden.dev. lnurl-server, LND and ntfy are at home, which has no ports forwarded; the tailnet link from Giran is the only way requests come in. lnurl-server returns JSON with a callback URL and the amounts it accepts, back through Giran. The wallet calls the callback with an amount, and Giran forwards it over the tailnet. lnurl-server asks LND for a new invoice using an invoice-only macaroon, gets the invoice, posts "invoice created" to ntfy, and hands the invoice back to the wallet through Giran. The wallet pays the invoice over Lightning to LND. LND's invoice stream reports that the invoice settled, lnurl-server posts "paid" to ntfy, and ntfy pushes it to my phone.</desc>
