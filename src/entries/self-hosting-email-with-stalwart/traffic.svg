<svg viewBox="0 0 1200 810" role="img" aria-labelledby="st-title st-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="st-title">Mail ports skip the proxy, so Stalwart sees real IPs</title>
<desc id="st-desc">The VPS sits behind the provider firewall, whose four inbound rules let TCP 25, 465, 587 and 993 in from anywhere. Other mail servers deliver inbound mail on port 25, and mail clients submit and read mail on 465, 587 and 993. Those ports go straight from the host to the Stalwart container, so Stalwart sees the real IP of whoever connects, and SPF checks, rate limits and IP bans work. HTTP and HTTPS on 80 and 443 go through Traefik, run by Dokploy, for the admin UI and autodiscovery. Traefik forwards those requests, so Stalwart sees only Traefik's internal IP; a ban on that IP takes the web side down, and the fix is putting the Docker subnets on Stalwart's allowed IP list. Traefik gets web certificates with the HTTP challenge; Stalwart gets its own with DNS-01 through the registrar API. Stalwart relays outbound mail through SMTP2Go as an MTA route, which delivers it to recipients' servers and sees outbound metadata only.</desc>
