<svg viewBox="0 0 1200 700" role="img" aria-labelledby="t3-title t3-desc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="20" fill="none" stroke-width="1.5">
<title id="t3-title">One T3 Code server per dev container, reached directly from my devices</title>
<desc id="t3-desc">My phone and laptops run the T3 Code app and connect straight to Oren, an LXC at home. On Oren, each workspace has its own host port, 37731, 37732 and so on, and socat forwards it to port 3773 in that workspace's dev container. Each dev container, such as unbeholden.dev or dotfiles, runs its own T3 Code server, which runs Claude Code and Codex inside the container. dcpair, on Oren, asks a container for a pairing link with Oren's address in it and prints it as a QR code for the phone to scan. Threads and pairings live in /history/t3, a bind mount from Oren. T3 Connect, which would add an account and a relay, is not used.</desc>
